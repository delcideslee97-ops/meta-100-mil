<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1565c0"><link rel="manifest" href="manifest.json">
<title>Meta 100 Mil</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f4f7fb;color:#172033}
header{background:#1565c0;color:white;padding:22px 18px 26px;border-radius:0 0 24px 24px}
h1{margin:0;font-size:25px}.sub{opacity:.9;margin-top:5px}
main{max-width:620px;margin:auto;padding:16px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #00000012}
.big{font-size:29px;font-weight:800}.muted{color:#657084}.row{display:flex;justify-content:space-between;gap:10px;margin:8px 0}
.progress{height:15px;background:#e5eaf0;border-radius:20px;overflow:hidden}.bar{height:100%;width:0;background:#1565c0}
button{width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:#1565c0;color:white;margin-top:10px}
button.secondary{background:#e9eef5;color:#172033}
#history{max-height:440px;overflow:auto}.day{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #edf0f4}
.day input{width:22px;height:22px}.today{font-weight:800}
.small{font-size:13px}
</style>
</head>
<body>
<header><h1>💰 Meta de R$ 100 mil</h1><div class="sub">3 anos • acompanhamento diário</div></header>
<main>
<div class="card">
<div class="muted">Meta diária calculada</div>
<div class="big" id="daily">R$ 0,00</div>
<div class="small muted">Simulação considerando 1% ao mês.</div>
</div>
<div class="card">
<div class="row"><b>Total depositado</b><b id="saved">R$ 0,00</b></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="row small"><span id="count">0 depósitos</span><span id="pct">0%</span></div>
<div class="row"><span>Falta</span><b id="left">R$ 100.000,00</b></div>
<button id="todayBtn">✓ FIZ O DEPÓSITO DE HOJE</button>
<button class="secondary" id="notify">🔔 Ativar lembrete diário</button>
</div>
<div class="card"><b>Histórico dos 3 anos</b><div id="history"></div></div>
</main>
<script>
const META=100000, DIAS=1095, RM=0.01;
const rd=(1+RM)**(1/30)-1;
const diario=META*rd/((1+rd)**DIAS-1);
const money=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const start=new Date(); start.setHours(0,0,0,0);
const key=d=>'m100_'+d.toISOString().slice(0,10);
let data=JSON.parse(localStorage.getItem('meta100')||'{}');

document.getElementById('daily').textContent=money(diario);
function dateFor(i){let d=new Date(start);d.setDate(d.getDate()+i);return d}
function render(){
 let n=0; for(let i=0;i<DIAS;i++) if(data[key(dateFor(i))]) n++;
 let saved=n*diario, pct=Math.min(100,saved/META*100);
 document.getElementById('saved').textContent=money(saved);
 document.getElementById('left').textContent=money(Math.max(0,META-saved));
 document.getElementById('count').textContent=n+' depósito'+(n===1?'':'s');
 document.getElementById('pct').textContent=pct.toFixed(2)+'%';
 document.getElementById('bar').style.width=pct+'%';
 document.getElementById('todayBtn').textContent=data[key(start)]?'✓ DEPÓSITO DE HOJE MARCADO':'✓ FIZ O DEPÓSITO DE HOJE';
 const h=document.getElementById('history'); h.innerHTML='';
 for(let i=0;i<DIAS;i++){
   let d=dateFor(i), k=key(d), checked=!!data[k];
   let div=document.createElement('label');div.className='day'+(i===0?' today':'');
   div.innerHTML='<input type="checkbox" '+(checked?'checked':'')+'><span>Dia '+(i+1)+' — '+d.toLocaleDateString('pt-BR')+' — '+money(diario)+'</span>';
   div.querySelector('input').onchange=e=>{data[k]=e.target.checked;localStorage.setItem('meta100',JSON.stringify(data));render()};
   h.appendChild(div);
 }
}
document.getElementById('todayBtn').onclick=()=>{data[key(start)]=true;localStorage.setItem('meta100',JSON.stringify(data));render()};
document.getElementById('notify').onclick=async()=>{
 if(!('Notification' in window)){alert('Seu navegador não oferece notificações para este aplicativo.');return}
 let p=await Notification.requestPermission();
 alert(p==='granted'?'Lembretes autorizados. Para receber avisos mesmo com o navegador fechado, o suporte depende do navegador/Samsung.':'Permissão de notificação não concedida.');
};
render();
</script>
</body></html>
